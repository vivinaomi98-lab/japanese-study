<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>	いらっしゃいませ </title>
    <link rel="stylesheet" href="styles/general.css">
    <link rel="stylesheet" href="styles/nav.css">
    <link rel="stylesheet" href="styles/configuration.css">
    <link rel="stylesheet" href="styles/vocabularyAlphabet.css">
    <link rel="stylesheet" href="styles/vocabulary.css">
    <link rel="stylesheet" href="styles/exercise.css">
    <link rel="stylesheet" href="styles/exerciseFeedback.css">
</head>

<body>

    <!-- Header & Navegação por Abas (Tabs) -->
    <header class="app-header">
        <div class="logo">Nihongo Mastery</div>
        <nav class="tab-navigation">
            <button class="tab-btn" data-target="exercise-screen" style="visibility: hidden;">Exercícios</button>
            <button class="tab-btn active" data-target="setup-screen">Configuração</button>
            <button class="tab-btn" data-target="vocab-screen">Vocabulário</button>
        </nav>
    </header>

    <main class="app-container">

        <!-- 1. ABA: CONFIGURAÇÃO (Setup Screen) -->
        <section id="setup-screen" class="tab-content active">
            <div class="setup-card">
                <h2>O que você quer estudar hoje?</h2>
                <p class="subtitle">Selecione o sistema e as categorias para carregar o conteúdo.</p>

                <hr>

                <!-- Seleção do Arquivo Fonte (Módulo) -->
                <div class="setup-group">
                    <h3>1. Escolha o Sistema</h3>
                    <div class="radio-options">
                        <label class="option-label">
                            <input type="radio" name="source-type" value="hiragana" checked>
                            <span>Hiragana (Alfabeto)</span>
                        </label>
                        <label class="option-label">
                            <input type="radio" name="source-type" value="katakana">
                            <span>Katakana (Alfabeto)</span>
                        </label>
                        <label class="option-label">
                            <input type="radio" name="source-type" value="verbs">
                            <span>Verbos</span>
                        </label>
                        <label class="option-label">
                            <input type="radio" name="source-type" value="colors">
                            <span>Cores</span>
                        </label>
                        <label class="option-label">
                            <input type="radio" name="source-type" value="pronouns">
                            <span>Pronomes</span>
                        </label>
                        <label class="option-label">
                            <input type="radio" name="source-type" value="adjectives">
                            <span>Adjetivos</span>
                        </label>
                        <label class="option-label">
                            <input type="radio" name="source-type" value="greetings">
                            <span>Saudacoes</span>
                        </label>
                        <label class="option-label">
                            <input type="radio" name="source-type" value="nouns">
                            <span>Substantivos</span>
                        </label>
                    </div>
                </div>

                <!-- Container Dinâmico para Sub-separações (Vogais ou Categorias Gramaticais) -->
                <div class="setup-group">
                    <h3>2. Filtros e Categorias</h3>
                    <div id="category-checkboxes-container" class="checkbox-grid">
                        <!-- Gerado dinamicamente via renderCategoryCheckboxes() -->
                        <p class="placeholder-text">Selecione um sistema acima para carregar as categorias disponíveis.
                        </p>
                    </div>
                </div>

                <button id="btn-start-study" class="btn-primary">Confirmar e Carregar</button>
            </div>
        </section>

        <!-- 2. ABA: VOCABULÁRIO (Vocab Screen) -->
        <section id="vocab-screen" class="tab-content">
            <div id="alphabet-matrix-container" class="matrix-section">
            </div>

            <hr class="section-divider">

            <div id="vocab-grid-2x2" class="grid-2x2">
            </div>
        </section>

        <!-- 3. ABA: EXERCÍCIOS (Exercise Screen) -->
        <section id="exercise-screen" class="tab-content">
            <div class="exercise-layout">

                <!-- Interface de Treino por Flashcard -->
                <div class="flashcard-container">
                    <div class="card-progress">
                        <span id="current-card-index">0</span>/<span id="total-cards-count">0</span>
                    </div>

                    <div class="flashcard">
                        <!-- Exibe o caractere ou palavra contida na propriedade 'jp' -->
                        <h1 id="display-character">あ</h1>
                        <p id="display-hint" class="hint-text"></p>
                    </div>

                    <!-- Formulário de Resposta com feedback visual (.success / .error) -->
                    <div id="input-wrapper" class="input-wrapper">
                        <input type="text" id="user-answer" autocomplete="off"
                            placeholder="Digite o Romaji correspondente..." autofocus>
                        <button id="btn-submit-answer" class="btn-action">Verificar</button>
                    </div>

                    <div id="feedback-message" class="feedback-message"></div>
                </div>

            </div>
        </section>

    </main>

    <!-- Scripts do Sistema -->
    <script src="scripts/state.js"></script>
    <script src="scripts/navbar.js"></script>
    <script src="scripts/registry.js"></script>
    <script src="scripts/configuration.js"></script>
    <script src="scripts/alphabetMatrix.js"></script>
    <script src="scripts/loadVocabulary.js"></script>
    <script src="scripts/exercise.js"></script>

    <!-- Vocabulary -->
    <script src="vocabulary/alphabet.js"></script>
    <script src="vocabulary/verbs.js"></script>
    <script src="vocabulary/colors.js"></script>
    <script src="vocabulary/pronouns.js"></script>
    <script src="vocabulary/adjetives.js"></script>
    <script src="vocabulary/greetings.js"></script>
    <script src="vocabulary/nouns.js"></script>

    <!-- Carregamos o script principal que gerenciará as abas, fetches e lógica de estados -->
    <script src="app.js" defer></script>
</body>

</html>
