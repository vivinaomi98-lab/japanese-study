<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本語 Study - Completo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header>
            <h1>日本語 <span>Study</span></h1>
            <nav class="tabs">
                <button class="tab active" data-tab="tabela">Tabela</button>
                <button class="tab" data-tab="exercicio">Exercício</button>
            </nav>
        </header>

        <main>
            <section id="tab-tabela" class="tab-content active">
                <div class="tables-vertical-container">
                    <div class="table-wrapper">
                        <h2>Hiragana</h2>
                        <table id="hiragana-table" class="kana-table"></table>
                    </div>
                    <div class="table-wrapper">
                        <h2>Katakana</h2>
                        <table id="katakana-table" class="kana-table"></table>
                    </div>
                </div>
            </section>

            <section id="tab-exercicio" class="tab-content">
                <div id="config-panel">
                    <div class="config-section">
                        <h3>Tipo de Treino</h3>
                        <div class="mode-options">
                            <label class="mode-label">
                                <input type="radio" name="ex-type" value="kana" checked>
                                <span>Caracteres</span>
                            </label>
                            <label class="mode-label">
                                <input type="radio" name="ex-type" value="words">
                                <span>100 Palavras Úteis</span>
                            </label>
                        </div>
                    </div>

                    <div id="kana-configs">
                        <div class="config-section">
                            <h3>Alfabeto</h3>
                            <div class="mode-options">
                                <label class="mode-label"><input type="radio" name="script-type" value="hiragana" checked><span>Hiragana</span></label>
                                <label class="mode-label"><input type="radio" name="script-type" value="katakana"><span>Katakana</span></label>
                                <label class="mode-label"><input type="radio" name="script-type" value="both"><span>Ambos</span></label>
                            </div>
                        </div>
                        <div class="config-section">
                            <h3>Famílias</h3>
                            <div class="family-options" id="family-options"></div>
                            <button id="select-all-btn" class="link-btn">Selecionar todas</button>
                        </div>
                    </div>

                    <div class="config-section">
                        <h3>Modo de Resposta</h3>
                        <div class="mode-options">
                            <label class="mode-label"><input type="radio" name="mode" value="h2r" checked><span>Escrita (→ Romaji)</span></label>
                            <label class="mode-label"><input type="radio" name="mode" value="r2h"><span>Escolha (→ Kana)</span></label>
                        </div>
                    </div>
                    <button id="start-btn">Começar Treino</button>
                </div>

                <div id="exercise-panel" class="hidden">
                    <button id="back-btn" class="link-btn">← Voltar</button>
                    <div class="exercise-header">
                        <span id="progress"></span>
                        <span id="score"></span>
                    </div>
                    <div id="question-container">
                        <div id="question-char"></div>
                        <div id="question-desc"></div>
                    </div>
                    <div id="typing-area" class="hidden">
                        <input type="text" id="romaji-input" placeholder="Resposta..." autocomplete="off">
                        <button id="check-btn">Verificar</button>
                    </div>
                    <div id="options-area" class="hidden"></div>
                    <div id="feedback"></div>
                    <button id="reveal-btn" class="hidden">Mostrar Resposta</button>
                </div>

                <div id="results-panel" class="hidden">
                    <div class="results-card">
                        <h2>Treino Finalizado!</h2>
                        <div class="results-stats">
                            <div><span class="stat-value" id="res-score"></span><span class="stat-label">Acertos</span></div>
                            <div><span class="stat-value" id="res-total"></span><span class="stat-label">Total</span></div>
                        </div>
                        <button id="restart-btn" class="btn-primary">Novo Treino</button>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="script/app.js"></script>
</body>
</html>
